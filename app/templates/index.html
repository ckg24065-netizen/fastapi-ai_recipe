{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center"
     style="min-height: 70vh;">

    <div class="card shadow-sm border-0 rounded-4 text-center p-5"
         style="max-width: 500px; width: 100%;">

        <div class="mb-4 fs-1">
            🍳
        </div>

        <h1 class="fw-bold mb-3">
            AIレシピ生成
        </h1>

        <p class="text-secondary mb-5">
            AIが{{ user }}さんのために
            オリジナルレシピを作成します
        </p>

        <form action="/recipes/create" method="get">

            <button type="submit"
                    class="btn btn-primary btn-lg px-5 py-3 rounded-3 shadow-sm">
                レシピを生成する
            </button>

        </form>

    </div>

</div>

{% endblock %}
