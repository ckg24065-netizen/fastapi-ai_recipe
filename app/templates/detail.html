{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm border-0 rounded-4 mb-4">

    <div class="card-body p-4">

        <!-- お気に入りボタン -->
        <div class="d-flex justify-content-end mb-3">

            {% if is_favorites %}
                <form action="/favorites/{{recipe.id}}" method="post">
                    <button type="submit" class="btn btn-warning">
                        ★ お気に入り済み
                    </button>
                </form>
            {% else %}
                <form action="/favorites/addition/{{recipe.id}}" method="post">
                    <button type="submit" class="btn btn-outline-warning">
                        ☆ お気に入り登録
                    </button>
                </form>
            {% endif %}

        </div>

        <!-- タイトル -->
        <div class="mb-4">
            <h1 class="display-6 fw-bold">
                {{ recipe.title }} {{ user }}
            </h1>

            <div class="text-secondary">
                {{ recipe.genre }} ・ {{ recipe.category }}
            </div>
        </div>

        <!-- 材料 -->
        <div class="mb-5">

            <h2 class="h4 border-bottom pb-2 mb-3">
                材料
            </h2>

            <div class="bg-light rounded-3 p-3">
                <p class="mb-0" style="white-space: pre-line;">
                    {{ recipe.material }}
                </p>
            </div>

        </div>
        <!-- 作り方 -->
        <div>
            <h3 class="h5 border-bottom pb-2">
                作り方
            </h3>

            <p class="mt-3" style="white-space: pre-line;">
                {{ recipe.recipe_text }}
            </p>
        </div>

    </div>
</div>

{% endblock %}
